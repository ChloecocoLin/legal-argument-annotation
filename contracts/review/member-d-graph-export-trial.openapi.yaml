openapi: 3.1.0
info:
  title: Member D frozen graph export trial proposal
  version: 0.1.0-pending-review
  description: Local/test only, never a production rendering certificate. Does not modify READY EX02.
paths:
  /api/local/member-d/graph-exports:
    post:
      operationId: createTrialFrozenGraphExport
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [finalVersionIds, format, include]
              properties:
                finalVersionIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: string, format: uuid}
                format: {type: string, enum: [PNG, SVG]}
                include:
                  type: array
                  items:
                    type: string
                    enum: [ELEMENTS, RELATIONS, PARTICIPANTS, DICTIONARIES, VERSIONS, PROVENANCE, ACTOR_DISPLAY_NAMES]
      responses:
        '200':
          description: Standard success envelope containing immutable trial ExportRecord, initially QUEUED. Same key/body returns first response without another record.
        '400':
          description: Invalid fields, format, IDs, duplicated sources, source graph invalid or input too large.
        '401':
          description: Authentication required.
        '403':
          description: Creator/admin permissions and current task ownership are required.
        '409':
          description: Source not IN_DATABASE or idempotency conflict; existing domain error code retained.
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    TrialComponentManifest:
      type: object
      additionalProperties: false
      required: [finalVersionId, graphId, componentId, componentNumber, fileEntryName, contentDigest, nodeIds, edgeIds, isolated, viewport]
      properties:
        finalVersionId: {type: string, format: uuid}
        graphId: {type: string, format: uuid}
        componentId: {type: string, description: Server graphId and stable component number}
        componentNumber: {type: integer, minimum: 1}
        fileEntryName: {type: string, description: One archived full image, matching FileAsset.fileName}
        contentDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
        nodeIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        edgeIds: {type: array, uniqueItems: true, items: {type: string}}
        isolated: {type: boolean}
        viewport:
          type: object
          additionalProperties: false
          required: [x, y, width, height]
          properties:
            x: {type: number}
            y: {type: number}
            width: {type: number, exclusiveMinimum: 0}
            height: {type: number, exclusiveMinimum: 0}
