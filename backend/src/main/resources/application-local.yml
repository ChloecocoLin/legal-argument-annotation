# 本地开发持久化 H2；开发依赖桩仅 local/test 启用。
spring:
  datasource:
    url: jdbc:h2:file:./.local-data/argument;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/migration/h2,classpath:db/migration/common,classpath:db/migration/dev,classpath:db/migration/trial
    # Local-only V900/V901 fixtures must not cause later shared V3+ migrations to be skipped.
    out-of-order: true

management:
  health:
    redis:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
