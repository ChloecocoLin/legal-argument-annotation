# 本地开发：使用 H2 内存库，无需外部 MySQL；禁用 Redis 健康检查
spring:
  datasource:
    url: jdbc:h2:mem:argument;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8

management:
  health:
    redis:
      enabled: false
